{% extends "base.html" %}
{% block title %}Edit Activity · Momentum{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <h2 class="fw-bold mb-4">Edit Activity</h2>
        <div class="card">
            <div class="card-body">
                <form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Skill</label>
                        <select name="skill_id" class="form-select" required>
                            {% for skill in skills %}
                            <option value="{{ skill.id }}" {% if skill.id == activity.skill_id %}selected{% endif %}>{{ skill.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="date" class="form-control" value="{{ activity.date.isoformat() }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Minutes</label>
                        <input type="number" name="minutes" class="form-control" min="1" max="1440" value="{{ activity.minutes }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Quality (1–10)</label>
                        <input type="range" class="form-range" min="1" max="10" name="quality" id="qualityRange"
                               value="{{ activity.quality }}"
                               oninput="document.getElementById('qualityVal').innerText=this.value">
                        <div class="text-center small text-muted">Selected: <span id="qualityVal">{{ activity.quality }}</span>/10</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Completion (%)</label>
                        <input type="range" class="form-range" min="0" max="100" step="5" name="completion" id="completionRange"
                               value="{{ activity.completion }}"
                               oninput="document.getElementById('completionVal').innerText=this.value">
                        <div class="text-center small text-muted">Selected: <span id="completionVal">{{ activity.completion }}</span>%</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Notes (optional)</label>
                        <textarea name="notes" class="form-control" rows="3">{{ activity.notes or '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('activities_list') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary-glow">Update Activity</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
